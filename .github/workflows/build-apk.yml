# Construit l'APK de Namaz Hatırlatıcı ici (dépôt public : machines GitHub gratuites) à partir du code du dépôt privé.
# Le code est lu avec la clé « NAMAZ_SRC » (lecture seule, dépôt namaz-rappel uniquement) et n'est pas recopié ici :
# seul l'APK est publié, en brouillon de version à vérifier avant publication.
name: Construire l'APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (doit être plus grand que le précédent, ex. 90 pour 1.90)"
        required: true
      ref:
        description: "Branche ou commit du dépôt privé"
        default: main
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kayamams1070-arch/namaz-rappel
          ref: ${{ inputs.ref }}
          token: ${{ secrets.NAMAZ_SRC }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Préparer
        run: |
          npm install --no-audit --no-fund
          pip install pillow
          python scripts/generate_assets.py
          npm test
          npx cap sync android
          sed -i 's/System.getenv("GITHUB_RUN_NUMBER")/System.getenv("APP_VERSION")/g' android/app/build.gradle
          grep -n "APP_VERSION" android/app/build.gradle
      - name: Construire l'APK
        working-directory: android
        env:
          APP_VERSION: ${{ inputs.version }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Brouillon de version avec l'APK
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.version }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk namaz-hatirlatici-1.$V.apk
          sha256sum namaz-hatirlatici-1.$V.apk
          gh release create v$V namaz-hatirlatici-1.$V.apk --repo "$GITHUB_REPOSITORY" --draft \
            --title "Namaz Hatırlatıcı 1.$V" --notes "Brouillon : à vérifier avant publication."
