# Vérifie le guide audio dans un vrai émulateur Android (vitesse ×3, invocations, sourates, tesbih),
# à partir du code du dépôt privé (clé NAMAZ_SRC, lecture seule). Rapport et capture : brouillon « emulateur-N ».
name: Guide dans l'émulateur
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche ou commit du dépôt privé"
        default: main
permissions:
  contents: write
jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kayamams1070-arch/namaz-rappel
          ref: ${{ inputs.ref }}
          token: ${{ secrets.NAMAZ_SRC }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Construire l'appli
        run: |
          npm install --no-audit --no-fund
          pip install pillow
          python scripts/generate_assets.py
          npx cap sync android
          cd android && gradle :app:assembleDebug --no-daemon
      - name: Place disque et accélération
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/local/.ghcup || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Guide dans l'émulateur (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          cores: 2
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-snapshot
          script: mkdir -p ci-out && adb install -r android/app/build/outputs/apk/debug/app-debug.apk && adb shell pm grant be.fatih.namazrappel android.permission.POST_NOTIFICATIONS; adb shell am start -W -n be.fatih.namazrappel/.MainActivity; sleep 25; adb shell input keyevent 224; adb shell wm dismiss-keyguard; timeout 600 node scripts/ci-guide-x3.js; adb logcat -d -v time Capacitor/Console:V Capacitor:W AndroidRuntime:E '*:S' > ci-out/logcat.txt 2>&1; true
        env:
          QEMU_AUDIO_DRV: none
      - name: Rapport (brouillon de version)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-out && ls ci-out
          [ -n "$(ls ci-out)" ] || echo "aucun résultat" > ci-out/vide.txt
          gh release create "emulateur-${{ github.run_number }}" ci-out/* --repo "$GITHUB_REPOSITORY" --draft --title "Émulateur ${{ github.run_number }}" --notes "Rapport interne (brouillon, non publié)."
